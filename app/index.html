<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFFFF"><meta name="description" content="NEXY SUMMIT 2027 参加者向け当日ガイド。プログラム・会場マップ・参加者一覧・お知らせ。"><meta property="og:title" content="NEXY SUMMIT 2027 当日ガイド"><meta property="og:image" content="https://nexyhub.jp/ogp.png"><link rel="manifest" href="/app/manifest.webmanifest"><link rel="icon" href="/app/icon-192.png"><link rel="apple-touch-icon" href="/app/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NEXY SUMMIT"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NEXY SUMMIT 2027 ガイド</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Outfit:wght@800&display=swap">
<style>
/* スマホ1画面：ホーム → プログラム → 参加者 → マップ → マイページ。PCでは中央480px */
:root{
  --on-teal:#0A2E2D; --teal:#40BCB8; --teal-deep:#0F6E6B; --teal-tint:#E3F5F4;
  --orange:#F54600; --orange-tint:#FFEFE5; --violet:#6B55C9; --violet-tint:#EEEBFA; --pink-tint:#FDE8EF;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F3F3; --ink:#16191C; --muted:#5E6468; --line:#E1E4E5;
  --hdr:#FFFFFF; --on-hdr:#16191C; --glass:rgba(22,25,28,.05); --glass2:rgba(22,25,28,.14); --fac:#8D9396; --pink:#E0457B;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --display:"Outfit","Noto Sans JP",system-ui,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.65;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[role=button],button{touch-action:manipulation}
.card:active,.pcard:active,.prow2:active,.tb:active,.btn:active,.chip:active{transform:scale(.98)}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:148px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:var(--ink)}
button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}
a{color:var(--teal-deep)}
h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.note{font-size:11px;color:var(--muted)}
main{padding:0 16px 16px}
.sec{margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:17px;font-weight:900}
.sec-h button{font-size:12px;color:var(--teal-deep);font-weight:700;min-height:40px;padding:0 0 0 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* hero: the slogan is live — a real participant's "want" sits in a teal speech bubble and rotates; one bubble outline floats behind */
.hero{margin-inline:-16px;color:var(--on-hdr);padding:22px 16px 24px;overflow:hidden;position:relative;isolation:isolate;
  background:radial-gradient(120% 70% at 105% -10%,rgba(64,188,184,.30),transparent 60%),radial-gradient(90% 60% at -20% 115%,rgba(245,70,0,.16),transparent 60%),var(--hdr)}
.hb{position:absolute;right:-70px;top:-36px;width:300px;height:auto;z-index:-1;opacity:.22;color:var(--teal)}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:12px;font-weight:700}
.hdate{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.04em;background:var(--on-hdr);color:var(--hdr);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.hvenue{display:inline-flex;align-items:center;gap:5px;color:var(--on-hdr);opacity:.85;min-height:32px;font-size:12px;font-weight:700}
.hvenue svg{width:14px;height:14px;color:var(--teal)}
.slog{margin:22px 0 0;font-weight:900;letter-spacing:-.02em;line-height:1.16;font-size:clamp(27px,8.5vw,40px)}
.slog .rest{white-space:nowrap}
.wrow{display:block;height:1.42em;white-space:nowrap;overflow:visible;position:relative}
.wb{display:inline-block;position:relative;background:var(--teal);color:var(--on-teal);border-radius:.28em;padding:.04em .3em .08em;line-height:1.2}
.wb::after{content:"";position:absolute;left:.5em;bottom:-.26em;border:.16em solid transparent;border-top:.2em solid var(--teal);border-bottom:0}
.slog .rest{display:block;margin-top:.12em}
.lead{margin-top:14px;font-size:13.5px;line-height:1.75;opacity:.82;max-width:28em}
.proof{margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.proof .stack{display:flex}
.proof .stack .av,.proof .stack i{width:28px;height:28px;font-size:11px;border-radius:50%;box-shadow:0 0 0 2px var(--hdr);display:grid;place-items:center}
.proof .stack>*+*{margin-left:-8px}
.proof b{font-family:var(--display);font-weight:800;font-size:18px;color:var(--teal-deep);margin-right:2px;font-variant-numeric:tabular-nums}
.proof .dot{width:4px;height:4px;border-radius:50%;background:var(--glass2)}
.hero .go{margin-top:18px}
.hero .go .btn.p{background:var(--on-hdr);color:var(--hdr)}
.hero .go .btn.s{background:var(--glass);color:var(--on-hdr)}
@media (prefers-reduced-motion:no-preference){
  .hb{animation:float 9s ease-in-out infinite alternate}@keyframes float{to{transform:translate(-14px,10px) rotate(-3deg)}}
  .wb.out{animation:wOut .26s var(--ease-in) both}.wb.in{animation:wIn .5s var(--ease) both}
  @keyframes wOut{to{opacity:0;transform:translateY(-30%) scale(.96)}}@keyframes wIn{from{opacity:0;transform:translateY(35%) scale(.94)}}
}
/* notice banner inside navy */
.nban{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:14px;padding:10px 12px;margin-bottom:16px;background:var(--glass);color:var(--on-hdr)}
.nban b{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nban .ar{opacity:.6}
.go{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.go .btn{min-height:48px;font-size:14px}
.proto{font-size:10px;color:var(--muted);margin-top:10px;text-align:center}

/* sticky top: app bar + per-tab controls */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;height:54px;padding:0 10px 0 16px;border-bottom:1px solid var(--line);background:var(--hdr);color:var(--on-hdr)}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(14px,4.4vw,17px);white-space:nowrap;letter-spacing:.01em;color:var(--on-hdr);padding:8px 0}
.brand b{color:var(--teal-deep)}
.barR{display:flex;align-items:center;gap:4px}
.ibtn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--on-hdr)}
.ibtn svg{width:22px;height:22px}
.ibtn.on{background:var(--glass)}
.ibtn .nb{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--orange);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--hdr)}
@media (max-width:420px){.mebtn .lbl{display:none}.mebtn{padding:0 2px}}
@media (max-width:380px){.regbtn .lbl2{display:none}.regbtn{padding:0 12px}}
.barR.tight .regbtn .lbl2{display:none}.barR.tight .regbtn{padding:0 12px}
.brand{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:clip}
.barR{flex:none}
@media (max-width:350px){.brand b{display:none}}
.regbtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--orange);color:#fff;font-weight:900;font-size:13px}
.regbtn svg{width:16px;height:16px}
.mebtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 10px;border-radius:999px;color:var(--on-hdr);font-size:12px;font-weight:700}
.mebtn .av{width:34px;height:34px;font-size:13px;box-shadow:0 0 0 2px var(--teal)}
.sub{background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sub h2{font-size:17px;font-weight:900}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;width:100%;padding:9px 0;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}

/* home */
.count{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.count b{font-family:var(--display);font-size:44px;line-height:1;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums}
.count span{font-size:13px}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;font-weight:900;font-family:var(--display)}
.step b{display:block;font-size:14px}
.step span{font-size:12px;color:var(--muted)}
.now-t{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.nowrow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.nowrow:first-of-type{border-top:0}
.nowrow button{font-size:13px;font-weight:700;line-height:1.45;min-height:40px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-align:center;background:var(--zt);color:var(--zc);white-space:nowrap}
.cta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--teal-tint);border-radius:var(--r);padding:14px}
.cta b{display:block;font-size:14px}
.cta span{font-size:12px;color:var(--muted)}
.facerow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.face{flex:none;width:76px;display:grid;justify-items:center;gap:4px;text-align:center}
.face span{font-size:11px;font-weight:700;line-height:1.3;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* zones */
.zA{--zc:var(--orange);--zt:var(--orange-tint)}
.zB{--zc:var(--teal-deep);--zt:var(--teal-tint)}
.zC{--zc:var(--violet);--zt:var(--violet-tint)}
.zF{--zc:var(--muted);--zt:var(--surface-2)}

/* program */
.slot{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding-top:14px}
.slot time{font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;padding-top:12px}
.cards{display:grid;gap:8px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 6px 11px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;cursor:pointer}
.card .bd{display:grid;gap:4px;min-width:0}
.card .ctop{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.card h3{font-size:14.5px;line-height:1.45;font-weight:700}
.card .tm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.easy{font-size:10px;font-weight:700;color:var(--teal-deep);border:1px solid var(--teal);border-radius:999px;padding:0 6px}
.kind{font-size:10px;color:var(--muted)}
.kd{display:inline-block;font-size:10px;font-weight:900;line-height:1.5;padding:0 6px;border-radius:4px;background:var(--surface);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.kd[data-k="ワークショップ"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kd[data-k="交流"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.kd[data-k="プレゼン"]{border-color:var(--orange);color:var(--orange)}
.legend2{margin-top:12px;display:grid;gap:6px}
.legend2 small{font-size:11px;font-weight:700;color:var(--muted)}
.legend2 .chips{flex-wrap:wrap}
.legend2 .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;min-height:40px}
.legend2 .chip .kd{pointer-events:none}
.kdesc{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tb.off,.prow2.off{opacity:.18}
.tb .kd{align-self:flex-start;font-size:9px;padding:0 4px;margin-bottom:1px}
/* day mode */
.day{margin-inline:-16px;border-bottom:1px solid var(--line);background:radial-gradient(110% 60% at 105% -10%,rgba(64,188,184,.22),transparent 60%),var(--hdr);color:var(--on-hdr);padding:16px 16px 18px;display:grid;gap:12px}
.day-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.day-h small{display:block;font-size:11px;font-weight:700;color:var(--teal-deep)}
.clock{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.day-h .btn{background:var(--glass);color:var(--on-hdr);min-height:40px}
.day .now-t .chip{background:var(--glass);border-color:var(--glass2);color:var(--on-hdr)}
.day .now-t .chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.mynext{background:var(--orange);color:#fff;border-radius:18px;padding:14px;display:grid;gap:6px;cursor:pointer;text-align:left}
.mynext small{font-size:11px;font-weight:900;opacity:.9}
.mynext b{font-size:18px;line-height:1.35;font-weight:900}
.mynext .when{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.mynext .when em{font-style:normal;background:#fff;color:var(--orange);border-radius:999px;padding:2px 10px;font-weight:900}
.dl{font-size:12px;font-weight:900;color:var(--teal-deep);margin:2px 0 -4px}
.liverow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--glass);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--on-hdr)}
.liverow .pill{font-size:10px}
.liverow b{display:block;font-size:13.5px;line-height:1.4}
.liverow .bar{display:block;height:4px;border-radius:2px;background:var(--glass);margin-top:6px;overflow:hidden}
.liverow .bar i{display:block;height:100%;background:var(--teal)}
.liverow .rest{font-size:11px;font-weight:700;opacity:.8;white-space:nowrap;font-variant-numeric:tabular-nums}
.day .quiet{font-size:12.5px;opacity:.8}
.preview-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--teal-tint);color:var(--ink);border-radius:16px;padding:14px}
.preview-card b{display:block;font-size:14px}
.preview-card span{font-size:12px;opacity:.8}
/* timetable focus + now line */
.ttcols button{font-size:11px;font-weight:900;text-align:center;padding:6px 2px;border-radius:6px;background:var(--zt);color:var(--zc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:36px;border:2px solid transparent}
.ttcols button[aria-pressed="true"]{border-color:var(--zc)}
.tt.one .tb{padding:8px 10px}
.tt.one .tb .bt{font-size:12px}
.tt.one .tb .bn{font-size:15px}
.tt.one .tb .bd2{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--orange);z-index:3;pointer-events:none}
.nowline span{position:absolute;left:0;top:-10px;background:var(--orange);color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:999px}
/* talk ok */
.okb{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;color:#fff;background:#2F8F4E;border-radius:999px;padding:1px 8px;justify-self:start}
.okb::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.oksw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--glass);border-radius:14px;padding:10px 12px;margin-top:8px;position:relative;text-align:left;color:var(--on-hdr)}
.oksw b{display:block;font-size:13.5px}
.oksw span{font-size:11px;opacity:.75}
.sw{flex:none;width:50px;height:30px;border-radius:15px;background:var(--glass2);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.oksw[aria-checked="true"] .sw{background:#2F8F4E}
.oksw[aria-checked="true"] .sw::after{transform:translateX(20px)}
/* map live */
.livedot{fill:var(--orange)}
@media (prefers-reduced-motion:no-preference){.livedot{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
.ztag{font-size:10px;font-weight:900;border-radius:999px;padding:1px 7px;margin-left:6px;background:var(--orange);color:#fff}
.ztag.nx{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
/* my page profile */
.prof-hero{margin-inline:-16px;border-bottom:1px solid var(--line);background:radial-gradient(110% 60% at 105% -10%,rgba(64,188,184,.22),transparent 60%),var(--hdr);color:var(--on-hdr);padding:22px 16px 20px;display:grid;justify-items:center;text-align:center;gap:6px;position:relative;overflow:hidden}
.prof-hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--teal);opacity:.16;top:-120px;right:-80px}
.prof-hero .av{width:108px;height:108px;font-size:40px;box-shadow:0 0 0 4px var(--teal);position:relative}
.prof-hero h2{font-size:24px;font-weight:900;margin-top:8px;position:relative}
.prof-hero .ti{font-size:13px;font-weight:700;color:var(--teal-deep);position:relative}
.prof-hero .dg{font-size:13.5px;opacity:.85;max-width:26em;position:relative}
.prof-hero .wn{margin-top:4px;background:var(--orange);color:#fff;font-weight:900;font-size:14px;padding:8px 14px;border-radius:14px;position:relative}
.prof-hero .tags{justify-content:center;position:relative}
.prof-hero .sns{position:relative}
.prof-hero .go{width:100%;position:relative;margin-top:10px}
.prof-hero .btn.s{background:var(--glass);color:var(--on-hdr)}
.prof-empty .av{background:var(--glass);color:var(--on-hdr);box-shadow:0 0 0 2px var(--glass2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{border-radius:14px;padding:12px 10px;display:grid;gap:2px;background:var(--bt);text-align:left}
.stat b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--bc);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:700;color:var(--ink)}
.mine-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.mine-row .av{width:52px;height:52px;font-size:18px;box-shadow:0 0 0 2px var(--teal)}
.mine-row b{display:block;font-size:15px;font-weight:900}
.mine-row span{font-size:12px;color:var(--muted)}
/* AI */
.fab{position:fixed;right:max(14px,calc(50% - 226px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:9;display:grid;place-items:center;align-content:center;gap:0;width:58px;height:58px;padding:0;font-size:10px;line-height:1.1;border-radius:50%;background:var(--teal);color:var(--on-teal);font-weight:900;font-size:14px;box-shadow:0 8px 24px -8px rgba(16,18,20,.35)}
.fab svg{width:22px;height:22px}
.fab{transition:transform .3s var(--ease),opacity .3s}
.fab.tuck{transform:translateY(24px) scale(.6);opacity:0;pointer-events:none}
.ai{display:flex;flex-direction:column;height:min(78dvh,640px)}
.ai-h{display:flex;align-items:center;gap:10px;padding-right:44px}
.ai-h i{width:36px;height:36px;border-radius:12px;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;flex:none}
.ai-h i svg{width:20px;height:20px}
.ai-h b{display:block;font-size:16px;font-weight:900}
.ai-h span{font-size:11px;color:var(--muted)}
.ai-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px 0;overscroll-behavior:contain}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);color:var(--ink);border-bottom-left-radius:4px}
.msg.a.wait{color:var(--muted)}
.msg.err{background:var(--orange-tint);color:var(--ink)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--teal);color:var(--teal-deep);font-size:12.5px;font-weight:700;background:var(--surface)}
.ai-f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.ai-f textarea{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;font-size:16px;resize:none;max-height:120px;line-height:1.5}
.ai-f button{min-width:64px;min-height:44px;border-radius:14px;font-weight:900;background:var(--ink);color:var(--bg)}
.ai-f button.stop{background:var(--surface-2);color:var(--ink)}
.ai-note{font-size:10.5px;color:var(--muted);margin-top:6px}
/* code & misc */
.codebox{margin-top:14px;border-radius:16px;background:var(--teal-tint);padding:18px 12px;text-align:center}
.codebox span{font-family:var(--display);font-weight:800;font-size:clamp(24px,8vw,32px);letter-spacing:.08em;color:var(--teal-deep);user-select:all;-webkit-user-select:all}
.steps2{margin:12px 0 0;padding-left:1.3em;display:grid;gap:8px;font-size:14px}
.a2hs{display:grid;gap:8px}
.inapp{background:var(--orange-tint);color:var(--ink);font-size:12.5px;font-weight:700;padding:10px 16px;line-height:1.6}
.inapp a{color:var(--orange)}
/* notices */
.nk{display:inline-block;font-size:10px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--nc);color:var(--bg);flex:none}
.nlist{display:grid;gap:8px;margin-top:8px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px;position:relative}
.ncard.new{border-color:var(--orange);box-shadow:inset 3px 0 0 var(--orange)}
.nhead{display:flex;align-items:center;gap:8px}
.nhead time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nnew{font-size:9px;font-weight:900;color:var(--orange);letter-spacing:.06em}
.ncard b{font-size:15px;line-height:1.45}
.ncard p{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.rm{justify-self:end;font-size:12px;font-weight:700;color:var(--orange);min-height:36px;padding:0 6px}
/* admin */
.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
.adm{display:grid;gap:12px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{min-height:42px;border-radius:10px;border:1.5px solid var(--line);font-weight:900;font-size:13px;text-align:center;color:var(--muted)}
.seg3 button[aria-checked="true"]{border-color:var(--nc);background:var(--nc);color:var(--bg)}
.adm .fld input,.adm .fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;resize:vertical}
.nprev{display:grid;gap:10px}.nprev small{font-size:12px;font-weight:700;color:var(--orange)}
.tbars{display:grid;gap:8px}
.tbars div{display:grid;grid-template-columns:104px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12px}
.tbars i{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:block}
.tbars em{display:block;height:100%;border-radius:5px;transition:width .6s var(--ease)}
.tbars b{text-align:right;font-variant-numeric:tabular-nums}
.pdc{display:flex;gap:6px}.pdc .btn{min-height:36px;padding:0 10px;font-size:12px}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.role{border-radius:16px;padding:14px 12px;display:grid;gap:8px;align-content:start;background:var(--bt)}
.role b{font-size:15px;font-weight:900;color:var(--bc)}
.role ul{margin:0;padding-left:1.1em;font-size:12px;display:grid;gap:3px}
.role small{font-size:10.5px;color:var(--muted);line-height:1.5}
.r1{--bt:var(--orange-tint);--bc:var(--orange)}.r2{--bt:var(--teal-tint);--bc:var(--teal-deep)}
/* members-only lock */
.lock{margin-top:22px;border-radius:20px;background:var(--teal-tint);color:var(--ink);padding:22px 18px;display:grid;justify-items:center;text-align:center;gap:10px;overflow:hidden;position:relative}
.lock .faces{display:flex;justify-content:center;margin-bottom:4px}
.lock .faces .av{width:46px;height:46px;font-size:16px;filter:blur(5px);box-shadow:0 0 0 3px var(--teal-tint)}
.lock .faces .av+.av{margin-left:-12px}
.lock .faces .ph{width:46px;height:46px;border-radius:50%;background:var(--bc,var(--teal));filter:blur(4px);opacity:.8}
.lock .faces .ph+.ph{margin-left:-12px}
.lock b{font-size:18px;font-weight:900}
.lock .n{font-family:var(--display);font-weight:800;color:var(--teal-deep);font-size:22px}
.lock p{font-size:13px;opacity:.82;max-width:24em}
.lock .btn{min-height:48px;width:100%;max-width:300px}
.lock svg{width:22px;height:22px;color:var(--teal-deep)}
/* theme list */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{border-radius:16px;padding:14px 12px;display:grid;gap:10px;align-content:start;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;text-align:left;min-height:118px}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--tc)}
.tile b{font-size:16px;font-weight:900;color:var(--ink)}
.tile .n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--tc);font-variant-numeric:tabular-nums}
.tile .n small{font-family:var(--sans);font-size:11px;font-weight:700;margin-left:2px}
.stack{display:flex}
.stack .av{width:30px;height:30px;font-size:12px;box-shadow:0 0 0 2px var(--surface)}
.stack .av+.av{margin-left:-8px}
.tile .zero{font-size:11px;color:var(--muted)}
.tg[data-t]{background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
.psns{display:flex;gap:8px;margin-top:2px}
.psns a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff;background:var(--sc);text-decoration:none}
/* benefits: 2x2 colored tiles / how-to: 4-step stepper */
.bene{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bene div{border-radius:16px;padding:14px 12px 12px;display:grid;gap:8px;align-content:start;background:var(--bt);color:var(--bc)}
.bene i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bc);color:var(--surface)}
.bene i svg{width:22px;height:22px}
.bene b{font-size:14px;line-height:1.35;color:var(--ink);font-weight:900}
.b1{--bt:var(--teal-tint);--bc:var(--teal-deep)}
.b2{--bt:var(--pink-tint);--bc:var(--pink)}
.b3{--bt:var(--orange-tint);--bc:var(--orange)}
.b4{--bt:var(--violet-tint);--bc:var(--violet)}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;position:relative}
.howto::before{content:"";position:absolute;top:22px;left:12%;right:12%;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--pink),var(--orange),var(--violet))}
.howto div{display:grid;justify-items:center;text-align:center;gap:6px;position:relative}
.howto i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--bc);color:#fff;box-shadow:0 0 0 4px var(--bg)}
.howto i svg{width:22px;height:22px}
.howto small{font-size:10px;font-weight:900;color:var(--bc)}
.howto b{font-size:12px;line-height:1.4;font-weight:900}
.sns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sns a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;color:#fff;background:var(--sc)}
.sns a i{font-style:normal;font-size:10px;font-weight:900;opacity:.85}
.s-ig{--sc:#C13584}.s-x{--sc:#111827}.s-tt{--sc:#0F6E6B}
.snsf{display:grid;gap:8px}
.snsf .srow{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px}
.snsf .srow span{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.snsf .srow span i{width:10px;height:10px;border-radius:3px;background:var(--sc)}
.snsf input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.show{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 70% at 100% 0%,#7FDAD6,transparent 60%),var(--teal);color:var(--on-teal);display:grid;place-content:center;justify-items:center;text-align:center;gap:10px;padding:24px}
.show .av{width:min(56vw,220px);height:min(56vw,220px);font-size:72px;box-shadow:0 0 0 4px #fff}
.show h2{font-size:clamp(28px,9vw,40px);font-weight:900;margin-top:8px}
.show .ti{font-size:15px;color:var(--on-teal);opacity:.8;font-weight:700}
.show .dg{font-size:15px;opacity:.85;max-width:22em}
.show .wn{margin-top:8px;background:var(--orange);color:#fff;font-weight:900;font-size:17px;padding:12px 18px;border-radius:18px;max-width:20em}
.show .tags{justify-content:center}
.show .tg{background:rgba(10,46,45,.12);color:var(--on-teal)}
.show button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:44px;height:44px;border-radius:50%;background:rgba(10,46,45,.12);color:var(--on-teal);font-size:20px}
.show .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;font-size:11px;opacity:.6}
.star,.heart{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.star svg,.heart svg{width:22px;height:22px}
.star[aria-pressed="true"]{color:var(--orange)}
.heart[aria-pressed="true"]{color:var(--pink)}
.star[aria-pressed="true"] path,.heart[aria-pressed="true"] path{fill:currentColor}
.card.clash{border-color:var(--orange)}
.lunch{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:var(--r);padding:9px 12px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);display:grid;gap:10px;justify-items:center}
.warn{font-size:12px;color:var(--orange);font-weight:700;margin-bottom:4px}

/* timetable */
.ttcols{display:grid;grid-template-columns:38px repeat(3,minmax(0,1fr));gap:6px}
.ttcols b{font-size:11px;font-weight:900;text-align:center;padding:4px 2px;border-radius:6px;background:var(--zt);color:var(--zc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.allday{margin-top:12px;background:var(--violet-tint);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.allday small{font-size:11px;font-weight:700;color:var(--violet)}
.allday div{display:flex;flex-wrap:wrap;gap:6px}
.allday button{font-size:12px;font-weight:700;background:var(--surface);border-radius:999px;min-height:40px;padding:5px 12px;color:var(--ink)}
.tt{position:relative;margin-top:12px}
.tt .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tt .hr span{position:absolute;left:0;top:-8px;font-family:var(--display);font-weight:800;font-size:12px;background:var(--bg);padding-right:4px;font-variant-numeric:tabular-nums}
.tt .hr.half{border-top-style:dashed;opacity:.6}
.tt .grid{position:absolute;top:0;bottom:0;left:44px;right:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tt .col{position:relative}
.tb{position:absolute;left:0;right:0;border-radius:8px;padding:5px 6px;background:var(--zt);border-left:4px solid var(--zc);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px;text-align:left}
.tb .bt{font-size:9.5px;white-space:nowrap;letter-spacing:-.02em;color:var(--zc);font-weight:700;font-variant-numeric:tabular-nums}
.tb .bn{font-size:11.5px;font-weight:700;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.tb.fav{box-shadow:inset 0 0 0 2px var(--orange)}
.tb .bs{position:absolute;right:4px;bottom:3px;width:14px;height:14px;color:var(--orange)}
.tb .bs path{fill:currentColor}
.lunchband{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.after{margin-top:16px}
.after small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
/* by place */
.place{margin-top:18px}
.place-h{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:8px}
.place-h i{align-self:stretch;border-radius:3px;background:var(--zc)}
.place-h b{display:block;font-size:16px;font-weight:900}
.place-h span{font-size:12px;color:var(--muted)}
.place-h button{font-size:12px;font-weight:700;color:var(--teal-deep);min-height:40px;padding:0 4px 0 12px}
.prow2{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 4px 4px 12px;margin-top:6px;cursor:pointer}
.prow2 .tm{font-family:var(--display);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.prow2 .tm small{display:block;font-family:var(--sans);font-weight:400;font-size:10px;color:var(--muted)}
.prow2 h3{font-size:14px;line-height:1.45;font-weight:700}
.prow2 .easy{display:inline-block;margin-top:2px}
.sheet .x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--muted)}
.sheet{position:relative}
/* people */
.av{border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:900;color:var(--muted);font-family:var(--display);overflow:hidden;flex:none;object-fit:cover}
.av.s{width:56px;height:56px;font-size:20px}
.av.m{width:64px;height:64px;font-size:22px}
.av.l{width:112px;height:112px;font-size:38px}
img.av{display:block}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;align-content:start;position:relative;cursor:pointer}
.pcard .heart{position:absolute;top:0;right:0;width:44px;height:44px}
.pcard .nm{font-size:14px;font-weight:900;line-height:1.35;overflow-wrap:anywhere}
.pcard .ti{font-size:11px;color:var(--teal-deep);font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.pcard .dg{font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pcard.me{border-color:var(--teal)}
.mebadge{font-size:10px;font-weight:700;background:var(--teal);color:var(--on-teal);border-radius:999px;padding:0 6px;justify-self:start}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tg{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.cnt{font-size:12px;color:var(--muted);margin-top:12px}

/* map */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:40px;padding:7px;border-radius:8px;font-size:13px;font-weight:700;text-align:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.mapwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-top:12px}
.mapwrap svg{width:100%;height:auto;display:block}
.z rect{stroke-width:1.5}
.z{cursor:pointer}
.z text{pointer-events:none;font-family:var(--sans)}
.z.dim rect{fill-opacity:.07}
.z.on rect{stroke-width:3}
.zinfo h3{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.zinfo h3 i{width:12px;height:12px;border-radius:3px;background:var(--zc);display:inline-block}
.zinfo p{margin-top:4px;font-size:13px}
.zinfo .hint{margin-top:8px;font-size:12px;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-radius:8px}
.mini{display:grid;gap:6px;margin-top:10px}
.mini button{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.mini span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.route{display:grid;margin-top:10px}
.route div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.route div::before{content:"";position:absolute;left:10px;top:18px;bottom:0;width:2px;background:var(--line)}
.route div:last-child::before{display:none}
.route i{width:22px;height:22px;border-radius:50%;background:var(--teal);display:block;margin-top:1px;border:5px solid var(--teal-tint)}
.route div:last-child i{background:var(--orange);border-color:var(--orange-tint)}
.route b{display:block;font-size:14px}
.route span{font-size:12px;color:var(--muted)}
.lnk{display:block;margin-top:10px;text-align:center;padding:11px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:13px;text-decoration:none;color:var(--ink)}

/* my / help */
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
summary{padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:400;font-size:18px;line-height:1}
details[open] summary::after{content:"−"}
details p{padding:0 14px 14px;font-size:13px;color:var(--muted)}
.kv div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.kv div:first-child{border-top:0;padding-top:0}
.kv span:first-child{color:var(--muted);font-size:12px}
.sos{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--orange-tint);border-radius:var(--r);padding:12px 14px}
.sos b{display:block}
.sos span{font-size:12px;color:var(--muted)}
.mecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.mecard b{display:block;font-size:15px}
.mecard span{font-size:12px;color:var(--muted)}
.plist{display:grid;gap:0}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow b{display:block;font-size:13px}
.prow span{font-size:11px;color:var(--muted)}
.prow .av{width:40px;height:40px;font-size:14px}
.btn{padding:11px 14px;border-radius:10px;font-weight:700;font-size:13px;text-align:center;white-space:nowrap}
.btn.p{background:var(--ink);color:var(--bg)}
.btn.o{background:var(--orange);color:#fff}
.btn.s{background:var(--surface-2);color:var(--ink)}
.btn.d{background:transparent;color:var(--orange);border:1px solid var(--orange)}
.btn[disabled]{opacity:.55;cursor:default}

/* tabbar */

async function aiAsk(q){

    const keep=e&&e.text;
    if(e&&e.code==="cancelled"){out.classList.remove("wait");out.textContent=keep||"止めました。";if(keep)aiTurns.push({role:"assistant",content:keep});else aiTurns.pop()}
    else{out.classList.remove("wait");out.classList.add("err");out.textContent=(e&&e.code==="refused"?"":(keep?keep+"\n\n":""))+(AI_ERR[e&&e.code]||"通信がうまくいきませんでした。もう一度送ってください。");
      aiTurns.pop();if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){sample=null;$("fab").hidden=true}}
  }finally{aiBusy=false;out.removeAttribute("id");const b=$("aiSend");if(b){b.textContent="送信";b.classList.remove("stop")}log.scrollTop=log.scrollHeight}
}
document.querySelector(".app").classList.add("boot");setTimeout(()=>document.querySelector(".app").classList.remove("boot"),1400);
render();

function openAdminLogin(){
  openSheet(`<h3>運営ログイン</h3><p class="note">運営メンバーだけが使います。パスワードは運営の代表から受け取ってください。</p>
    <form id="alForm" novalidate><div class="fld"><label for="alIn">パスワード</label><input id="alIn" type="password" autocomplete="current-password" style="font-size:16px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px"></div>
    <p class="err" id="alErr" role="alert"></p><button class="btn p" type="submit" style="width:100%">ログイン</button></form>`,"運営ログイン");
  $("alForm").addEventListener("submit",async e=>{e.preventDefault();$("alErr").textContent="";try{await api("admin_login",{password:$("alIn").value});isAdmin=true;await loadPeople();closeSheet();tab="admin";render();toast("運営としてログインしました")}catch(x){$("alErr").textContent=x.message}})}

function inAppBanner(){const ua=navigator.userAgent;const line=/ Line\//i.test(ua),insta=/Instagram|FBAN|FBAV/i.test(ua);if(!line&&!insta)return;
  const b=document.createElement("div");b.className="inapp";

/* ---------- data loading ---------- */
async function loadPeople(){try{const j=await api("people");peopleCount=j.count;if(j.locked){people=[];lockWants=j.wants||[]}else{people=j.people||[]}
  if(meP){const f=people.find(p=>p.id===meP.id);if(f)meP=f}peopleState="ready"}catch(e){if(!people.length)peopleState="off"}
  const lk="r"+isMember();if(lk!==window.__lk&&tab==="people"){window.__lk=lk;render()}else{window.__lk=lk;renderMain()}}
async function loadNotices(){try{const j=await api("notices");applyNotices(j.notices)}catch(e){}}
async function boot(){
  inAppBanner();
  try{const j=await api("me");apiOK=true;setMe(j);peopleCount=j.count||0;
    if(j.prefs){(j.prefs.plan||[]).forEach(i=>fav.add(i));(j.prefs.talk||[]).forEach(i=>talk.add(i));if(+j.prefs.seen>noticeSeen)noticeSeen=+j.prefs.seen;
      try{localStorage.setItem("nexy27-plan",JSON.stringify([...fav]));localStorage.setItem("nexy27-talk",JSON.stringify([...talk]))}catch(e){}}
  }catch(e){apiOK=e.status===0?null:false;apiSetup=e.status===503}
  await Promise.all([loadPeople(),loadNotices()]);
  setInterval(()=>{if(!document.hidden)loadNotices()},20000);
  setInterval(()=>{if(!document.hidden&&(tab==="people"||tab==="home"||tab==="admin"))loadPeople()},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadNotices();loadPeople()}});
}
boot();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/app/sw.js",{scope:"/app/"}).catch(()=>{}));
